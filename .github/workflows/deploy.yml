name: Build and Deploy

on:
  push:
    branches:
      - main # 또는 배포에 사용하는 브랜치 이름

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Node.js 20 LTS 버전을 명시적으로 사용하도록 수정합니다.
          node-version: '20.x'
          cache: 'npm' # npm 의존성 캐싱으로 빌드 속도 향상

      - name: Install dependencies
        run: npm ci # package-lock.json을 기반으로 정확한 의존성 설치

      - name: Build project
        run: npm run build # package.json에 정의된 빌드 스크립트 실행

      # 여기에 GitHub Pages 또는 다른 서비스로 배포하는 단계를 추가합니다.
      # 예: actions/deploy-pages@v4 등